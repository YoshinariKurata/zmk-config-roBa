# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
 # 自動マウスレイヤーのしきい値の比較用 (決まったら roBa_R.conf に書いて消す)
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_PMW3610_MOVEMENT_THRESHOLD=5
   artifact-name: roBa_R_threshold_5
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_PMW3610_MOVEMENT_THRESHOLD=10
   artifact-name: roBa_R_threshold_10
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_PMW3610_MOVEMENT_THRESHOLD=20
   artifact-name: roBa_R_threshold_20
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_PMW3610_MOVEMENT_THRESHOLD=40
   artifact-name: roBa_R_threshold_40
 - board: seeeduino_xiao_ble
   shield: roBa_L
 - board: seeeduino_xiao_ble
   shield: settings_reset
